[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "deeptrace"
version = "0.1.0"
description = "DeepTrace - Intelligent Deepfake Detection and Forensic Analysis"
requires-python = ">=3.9"
dependencies = ["numpy", "pyyaml"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
