# Design choices for Part 3 (app). Values are added here step by step, never silently.
run:
  seed: 42        # passed to the LLM: the same model + the same prompt gives the same text
  device: cpu     # required by the shared config loader; the app itself never needs a GPU

# Local LLM served by Ollama on this laptop. It explains the evidence JSON; it is never a detector.
llm:
  base_url: http://127.0.0.1:11434   # Ollama's default; 127.0.0.1 = not reachable from other machines
  model: qwen3:4b-instruct           # chosen by measurement (docs/part3_llm_setup.md): no wording violation
                                     # on 3 examples vs 3 for llama3.2:3b; about 2x slower. Not plain qwen3:4b:
                                     # that tag is the slower "thinking" variant
  temperature: 0.0                   # most repeatable wording; the explainer must not improvise
  num_ctx: 4096                      # Ollama's default context, set explicitly to bound RAM use
  max_output_tokens: 500             # hard cap on the answer (worst case ~70 s at the measured 7.5 tok/s). The
                                     # prompt asks for <= 40 words per section (~300 tokens for 5 sections); a
                                     # cut-off answer is not valid JSON, so the template is shown instead
  timeout_s: 300                     # CPU generation is slow; after 5 min the LLM counts as unavailable

# FastAPI backend (src/deeptrace/app/api.py). Run: uvicorn deeptrace.app.api:app --host 127.0.0.1 --port 8000
app:
  jobs_dir: ~/Downloads/deeptrace_outputs/app_jobs  # one folder per upload; must be outside the repository
  max_upload_mb: 100          # a 5 s 540p clip is ~1 MB and photos are a few MB; this only stops absurd uploads
  analysis_timeout_s: 900     # measured ~13 s per image, ~45 s per 5 s video (Part 2); long videos take longer
  run_name: mixed             # detector run: <DEEPTRACE_ROOT>/checkpoints/mixed/best.pt (v2, Part 1)
