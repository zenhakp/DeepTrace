# Design choices for Part 1. Values are added here step by step, never silently.
run:
  seed: 42        # global random seed
  device: auto    # cpu | cuda | auto
  deterministic: false   # true = slower, but bitwise-repeatable GPU runs

# Datasets are pinned by full commit sha so experiments are reproducible.
# 'files' must list exactly what to download (a whole-repo download is refused).
datasets:
  deepfakeface:            # primary: train / validation / in-domain test
    hf_repo: OpenRL/DeepFakeFace
    revision: eb2a54fbf2567790bd3dc61d09fdaade6bb6c31c
    files: [wiki.zip, inpainting.zip, insight.zip, text2img.zip]
  openfake:                # external test only; a face-filtered subset is chosen in a later step
    hf_repo: ComplexDataLab/OpenFake
    revision: 3247b942f18d39d1fd476b1077852af033d35d8c
    files: []

# Leakage-safe split. Unit = group: one real photo plus every fake derived from it.
split:
  seed: 42
  fractions: {train: 0.8, val: 0.1, test: 0.1}

# Face-crop preprocessing (design choices; changing any of them creates a separate output folder).
preprocess:
  face_model_url: https://github.com/opencv/opencv_zoo/raw/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx
  face_model_file: face_detection_yunet_2023mar.onnx
  face_score_threshold: 0.6
  crop_margin: 1.3          # square crop side = margin x max(face width, face height)
  output_size: 380          # EfficientNet-B4 native resolution
  jpeg_quality: 95
  gray_chroma_eps: 2.0      # a real photo with mean channel difference below this counts as grayscale

# Data loading. Degradations use the same probabilities for every image (the label is never an
# input to them) and only run in training.
loading:
  image_size: 380
  batch_size: 16
  num_workers: 2
  hflip: true
  degrade:
    p_blur: 0.3
    blur_sigma: [0.1, 1.5]
    p_resize: 0.3
    resize_scale: [0.5, 1.0]
    p_jpeg: 0.5
    jpeg_quality: [40, 95]

# Training (design choices, untuned).
train:
  epochs: 3
  lr: 0.0002
  weight_decay: 0.01
  warmup_steps: 300
  amp: true               # mixed precision, used only on CUDA
  fakes_per_real: 1       # class-balanced epochs: all real + this many fakes per real, re-drawn each epoch
  ckpt_every_steps: 500
  log_every_steps: 50
  pretrained: true        # ImageNet initialisation (weights downloaded from the Hugging Face Hub)
  drop_rate: 0.2

